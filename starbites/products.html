<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore the Star Bites menu, including bubble waffles, milkshakes and refreshers.">
    <title>Star Bites | Products</title>
    <link rel="stylesheet" href="styles.css">
    <script src="apps.js" defer></script>
</head>

<body>

    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="products.html" aria-current="page">Products</a></li>
                <li><a href="enquiry.html">Enquiries</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>

        <div class="logo-container">
            <img src="images/logo.png.jpg" alt="Star Bites logo">
        </div>

        <h1 class="page-title">Our Products</h1>
    </header>

    <main>
        <section class="products-intro">
            <h2>Explore Our Menu</h2>
            <p>
                Discover our selection of delicious bubble waffles,
                drinks and special combinations.
            </p>
        </section>

        <section class="product-controls">
            <div class="form-group">
                <label for="product-search">Search products</label>
                <input type="search"
                       id="product-search"
                       placeholder="Search for a product...">
            </div>

            <div class="form-group">
                <label for="product-category">Choose a category</label>
                <select id="product-category">
                    <option value="All">All Products</option>
                    <option value="Waffles">Waffles</option>
                    <option value="Drinks">Drinks</option>
                    <option value="Combos">Combos</option>
                </select>
            </div>

            <div class="form-group">
                <label for="product-sort">Sort products</label>
                <select id="product-sort">
                    <option value="default">Default</option>
                    <option value="name">Name</option>
                    <option value="price-low">Price: Low to High</option>
                    <option value="price-high">Price: High to Low</option>
                </select>
            </div>
        </section>

        <section id="product-list" class="products-container"
                 aria-live="polite">
            <p>Loading products...</p>
        </section>

        <div id="image-lightbox"
             class="lightbox"
             aria-hidden="true">
            <button type="button"
                    id="lightbox-close"
                    class="lightbox-close"
                    aria-label="Close enlarged image">
                &times;
            </button>

            <img id="lightbox-image" src="" alt="">
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Star Bites | All Rights Reserved</p>
    </footer>

    <script src=""apps.js" defer></script>
</body>
</html>
